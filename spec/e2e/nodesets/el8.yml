HOSTS:
  el8:
    roles:
      - agent
    platform: el-8-x86_64
    hypervisor: docker
    image: ondemand-e2e:el8
    docker_preserve_image: true
    docker_cmd:
      - '/usr/sbin/init'
    docker_env:
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
    docker_container_name: 'ondemand-el8'
    docker_port_bindings:
      22/tcp:
        - HostPort: '2222'
          HostIp: '127.0.0.1'
      8080/tcp:
        - HostPort: '8080'
          HostIp: '0.0.0.0'
      5556/tcp:
        - HostPort: '5556'
          HostIp: '0.0.0.0'
CONFIG:
  log_level: debug
  type: foss
ssh:
  password: root
  auth_methods: ["password"]