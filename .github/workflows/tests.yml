name: Tests

on:
  push:
    branches: [master, e2e-testing]
  pull_request:
  schedule:
    - cron: "0 2 * * *"

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  e2e-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        dist: [el8]
        arch: [x86_64]
        version: ["4.0"]
    runs-on: ${{ matrix.os }}
    name: E2E test ${{ matrix.dist }}-${{ matrix.arch }}

    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cache Docker images
        id: cache-docker
        uses: actions/cache@v3
        with:
          path: /tmp/docker-cache
          key: docker-${{ runner.os }}-${{ matrix.dist }}-${{ hashFiles('spec/e2e/**/*') }}

      - name: Load cached Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          mkdir -p /tmp/docker-cache
          docker load < /tmp/docker-cache/container.tar || true

      - name: Setup Ruby using Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler: "2.5.23"
          bundler-cache: true

      # 1. Restore cached packages (if any)
      - name: Restore package cache
        uses: actions/cache@v3
        with:
          path: dist
          key: package-${{ runner.os }}-${{ matrix.dist }}-${{ matrix.arch }}-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            package-${{ runner.os }}-${{ matrix.dist }}-${{ matrix.arch }}-

      # 1a. Show what was actually restored
      - name: List dist contents
        run: |
          echo "=== dist/ (after cache restore) ==="
          find dist -maxdepth 3 -type f | head -n 20 || true

      # 2. Decide whether we really need to build
      - name: Skip build if package exists
        id: check-build
        run: |
          if find dist -type f -name '*.rpm' -print -quit | grep -q .; then
            echo "skip_build=true"  >> "$GITHUB_OUTPUT"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      # 2a. Quick visibility
      - name: Debug skip flag
        run: echo "::notice title=Skip-flag::${{ steps.check-build.outputs.skip_build }}"

      # 3. Build only when needed
      - name: Build package
        if: steps.check-build.outputs.skip_build == 'false' && matrix.arch == 'x86_64'
        env:
          VERSION: "${{ matrix.version }}.0"
          OOD_PACKAGING_DEBUG: "true"
          CONTAINER_RT: podman
        run: |
          if [[ "${{ matrix.dist }}" == "el8" ]]; then
            unset CONTAINER_RT   # forces docker/podman selection inside task
          fi
          bundle exec rake package:build[${{ matrix.dist }},${{ matrix.arch }}]

      # 4. Save new/updated artifacts back to cache
      - name: Save package cache
        if: steps.check-build.outputs.skip_build == 'false'
        uses: actions/cache@v3
        with:
          path: dist
          key: package-${{ runner.os }}-${{ matrix.dist }}-${{ matrix.arch }}-${{ hashFiles('**/Gemfile.lock') }}

      - name: Run package tests
        if: matrix.arch == 'x86_64'
        env:
          BEAKER_set: ${{ matrix.dist }}
          OOD_BUILD_REPO: ${{ matrix.version }}
        run: |
          bundle exec rake test:e2e SPEC_OPTS="--format documentation --format json --out rspec_results.json"

      - name: Save Docker image
        if: always()
        run: |
          if [ -f /tmp/docker-cache/container.tar ]; then
            echo "Found cached container, saving to GitHub cache"
            exit 0
          else
            echo "No cached container found"
            exit 1
          fi

      - name: Analyze test times
        if: always()
        run: |
          echo "=== Test Execution Times ===" > test_times.txt
          echo "Format: seconds | file | test description" >> test_times.txt
          echo "--------------------------------" >> test_times.txt
          jq -r '.examples[] | "\(.run_time) | \(.file_path) | \(.full_description)"' rspec_results.json | sort -nr >> test_times.txt
          cat test_times.txt

          echo "=== Summary by File ===" >> test_times.txt
          echo "Format: seconds | file" >> test_times.txt
          echo "--------------------------------" >> test_times.txt
          jq -r '.examples[] | "\(.file_path) \(.run_time)"' rspec_results.json | awk '{a[$1]+=$2} END{for(i in a) print a[i], "|", i}' | sort -nr >> test_times.txt
          cat test_times.txt

      - name: Upload test timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-results
          path: test_times.txt
