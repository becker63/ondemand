name: E2E Tests (el8 only)

on:
  push:
  pull_request:

jobs:
  e2e-el8:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler: "2.5.23"
          bundler-cache: true

      - name: Build e2e Docker image
        run: |
          docker build -t ondemand-e2e:el8 -f spec/e2e/nodesets/Dockerfile.el8 .

      - name: Run e2e tests
        env:
          BEAKER_set: e2e/nodesets/el8.yml
        run: |
          bundle exec rake test:e2e